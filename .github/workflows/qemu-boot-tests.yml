name: LK QEMU Boot Tests

# Run boot tests on QEMU for various architectures

on:
  pull_request:
  push:
    branches-ignore:
      - 'wip/**'
      - 'docs/**' # Skip tests for documentation branches
    paths-ignore:
      - '**.md'   # Skip tests when only markdown files change
      - 'docs/**' # Skip tests for docs directory changes

jobs:
  qemu-boot-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm
          - arm64
          - m68k
          - riscv32
          - riscv64
          - x86
          - x86-64
        toolchain-ver: [15.2.0]

    env:
      ARCH: ${{ matrix.arch }}
      TOOLCHAIN_VER: ${{ matrix.toolchain-ver }}

    steps:
    - name: banner
      shell: bash
      run: |
        printf "Running QEMU boot tests with %d processors\n" "$(nproc)"
        grep -oP '(?<=model name\t: ).*' /proc/cpuinfo|head -n1
        echo ARCH = $ARCH
        echo TOOLCHAIN_VER = $TOOLCHAIN_VER

    # check out the source
    - name: checkout
      uses: actions/checkout@v6

    # Install QEMU
    - name: install qemu
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86

    # compute the toolchain prefix this project will need
    - name: compute toolchain
      shell: bash
      run: |
        case "${{ matrix.arch }}" in
            arm) TOOLCHAIN_PREFIX="arm-eabi-" ;;
            arm64) TOOLCHAIN_PREFIX="aarch64-elf-" ;;
            m68k) TOOLCHAIN_PREFIX="m68k-elf-" ;;
            riscv32) TOOLCHAIN_PREFIX="riscv32-elf-" ;;
            riscv64) TOOLCHAIN_PREFIX="riscv64-elf-" ;;
            x86) TOOLCHAIN_PREFIX="i386-elf-" ;;
            x86-64) TOOLCHAIN_PREFIX="x86_64-elf-" ;;
            *) echo "Unknown architecture: ${{ matrix.arch }}" && exit 1 ;;
        esac
        echo "TOOLCHAIN_PREFIX=${TOOLCHAIN_PREFIX}" >> $GITHUB_ENV
        echo "TOOLCHAIN=${TOOLCHAIN_PREFIX}${{ matrix.toolchain-ver }}-$(uname)-$(uname -m)" >> $GITHUB_ENV

    # maintain a directory archives/ in the repo
    # it will contain tarballs of various toolchains
    - name: cache
      uses: actions/cache@v5
      id: cache
      with:
        # A list of files, directories, and wildcard patterns to cache and restore
        path: archives
        # An explicit key for restoring and saving the cache
        key: archives-${{ env.TOOLCHAIN }}-${{ env.TOOLCHAIN_ALT }}

    # download a toolchain from https://newos.org/toolchains
    # if not already cached
    - name: fetch/extract toolchain
      shell: bash
      run: |
        TOOLCHAIN_BASE_URL="https://newos.org/toolchains"
        TOOLCHAIN_SUFFIX="tar.xz"
        TOOLCHAIN_ADDRESS="$TOOLCHAIN_BASE_URL/$TOOLCHAIN.$TOOLCHAIN_SUFFIX"
        mkdir -p archives
        cd archives
        echo "Downloading toolchain $TOOLCHAIN from $TOOLCHAIN_ADDRESS"
        wget -v -N $TOOLCHAIN_ADDRESS || exit 1
        cd ..
        echo "Unpacking $TOOLCHAIN"
        tar xf archives/$TOOLCHAIN.$TOOLCHAIN_SUFFIX || exit 1
        echo "$GITHUB_WORKSPACE/$TOOLCHAIN/bin" >> $GITHUB_PATH

    # run the boot test for this architecture
    # this includes the RAM backed FAT tests, which format their own volumes and
    # so need no disk image or host tooling
    - name: run boot test
      shell: bash
      run: |
        ./scripts/run-qemu-boot-tests.py --arch ${{ matrix.arch }}

  # The FAT tests that need a real disk image. Separate from the matrix above
  # because they need dosfstools and mtools to build and then verify the images,
  # and because the host side verification is what makes them worth running:
  # fsck.fat checks the metadata graph, mtools checks the bytes.
  fat-image-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # arch has to be a real axis here: keys that only appear in include
        # entries are merged into the existing combinations rather than
        # creating new ones, so an include-only matrix would collapse to a
        # single job with the last entry winning.
        arch: [arm64, m68k]
        toolchain-ver: [15.2.0]
        include:
          # arm64 is the primary target and gates the build
          - arch: arm64
            toolchain-prefix: aarch64-elf-
            experimental: false
          # m68k is the only big endian architecture in the tree. FAT is little
          # endian on disk, so this is the one place the byte swapping is
          # exercised, and it is 32 bit, which catches width bugs the 64 bit
          # targets hide. It passes today; kept non-gating so a failure here
          # reports rather than blocking. Promote it if it proves stable.
          - arch: m68k
            toolchain-prefix: m68k-elf-
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    env:
      TOOLCHAIN_VER: ${{ matrix.toolchain-ver }}

    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: install qemu and filesystem tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-arm qemu-system-misc dosfstools mtools

    - name: compute toolchain
      shell: bash
      run: |
        echo "TOOLCHAIN=${{ matrix.toolchain-prefix }}${{ matrix.toolchain-ver }}-$(uname)-$(uname -m)" >> $GITHUB_ENV

    - name: cache
      uses: actions/cache@v5
      id: cache
      with:
        path: archives
        key: archives-${{ env.TOOLCHAIN }}

    - name: fetch/extract toolchain
      shell: bash
      run: |
        TOOLCHAIN_ADDRESS="https://newos.org/toolchains/$TOOLCHAIN.tar.xz"
        mkdir -p archives
        cd archives
        wget -v -N $TOOLCHAIN_ADDRESS || exit 1
        cd ..
        tar xf archives/$TOOLCHAIN.tar.xz || exit 1
        echo "$GITHUB_WORKSPACE/$TOOLCHAIN/bin" >> $GITHUB_PATH

    - name: run FAT image tests
      shell: bash
      run: |
        ./scripts/run-fat-tests.py --arch ${{ matrix.arch }}

