name: LK CI (Rust)

# Build targets that support `USE_RUST=1`

on:
  pull_request:
    paths-ignore:
      - '**.md'   # Skip builds when only documentation changes
      - 'LICENSE'
      - 'docs/**'
  push:
    branches-ignore:
      - 'wip/**'
      - 'docs/**' # Skip builds for documentation branches
    paths-ignore:
      - '**.md'   # Skip builds when only documentation changes
      - 'LICENSE'
      - 'docs/**'

# These jobs only build the tree; they never write back to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain-ver: [19]
        debug: [2, 0]
        project:
          # Currently, this is hard-coded here, but should probably be gathered
          # from the source.
          - qemu-virt-arm64-test
          - pc-x86-64-test
          - qemu-virt-riscv32-test
          - qemu-virt-riscv64-test
          - qemu-virt-riscv64-supervisor-test
    env:
      PROJECT: ${{ matrix.project }}
      TOOLCHAIN_VER: ${{ matrix.toolchain-ver }}
      DEBUG: ${{ matrix.debug }}
      UBSAN: 0  # UBSan runtimes for baremetal are not part of the toolchain
    steps:
    - name: banner
      shell: bash
      run: |
        printf "Building with %d processors\n" "$(nproc)"
        grep -oP '(?<=model name\t: ).*' /proc/cpuinfo|head -n1
        echo PROJECT = $PROJECT
        echo TOOLCHAIN_VER = $TOOLCHAIN_VER
        echo DEBUG = $DEBUG
        echo UBSAN = $UBSAN

    - name: checkout
      uses: actions/checkout@v6

    # Install LLVM and set up the required environment variables
    - name: compute toolchain
      shell: bash
      run: |
        env -i DEBIAN_FRONTEND=noninteractive sudo apt-get update
        sudo apt-get install -y clang-${{ matrix.toolchain-ver }} lld-${{ matrix.toolchain-ver }}
        GCC_TOOLCHAIN_PREFIX=$(make list-toolchain | grep TOOLCHAIN_PREFIX | tail -1 | cut -d ' ' -f 3)
        # Map the GCC toolchain prefix to a clang --target argument:
        CLANG_TRIPLE=$(echo "${GCC_TOOLCHAIN_PREFIX}" | sed 's/-elf-/-unknown-elf/g')
        LLVM_BINDIR=/usr/lib/llvm-${{ matrix.toolchain-ver }}/bin
        echo "CC=${LLVM_BINDIR}/clang --target=${CLANG_TRIPLE}" >> $GITHUB_ENV
        echo "LD=${LLVM_BINDIR}/ld.lld" >> $GITHUB_ENV
        echo "OBJDUMP=${LLVM_BINDIR}/llvm-objdump" >> $GITHUB_ENV
        echo "OBJCOPY=${LLVM_BINDIR}/llvm-objcopy" >> $GITHUB_ENV
        echo "CPPFILT=${LLVM_BINDIR}/llvm-cxxfilt" >> $GITHUB_ENV
        echo "SIZE=${LLVM_BINDIR}/llvm-size" >> $GITHUB_ENV
        echo "NM=${LLVM_BINDIR}/llvm-nm" >> $GITHUB_ENV
        echo "STRIP=${LLVM_BINDIR}/llvm-strip" >> $GITHUB_ENV
        echo "TOOLCHAIN_PREFIX=/invalid/prefix/should/not/be/used" >> $GITHUB_ENV
        echo "LIBGCC=" >> $GITHUB_ENV
        cat "$GITHUB_ENV"

    # build it
    - name: build
      shell: bash
      run: |
        make -j $(nproc) USE_RUST=1
    # When LK is compiled with DEBUG=0, there's no console and no way for us
    # to read test output
    - name: qemu
      if: ${{ matrix.project == 'qemu-virt-arm64-test' }}
      shell: bash
      run: |
        env -i DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends qemu-system-arm expect
    - name: uefi unittest
      if: ${{ matrix.project == 'qemu-virt-arm64-test' }}
      shell: bash
      run: |
        ./scripts/uefi_unittest.exp
    - name: unittest
      if: ${{ matrix.project == 'qemu-virt-arm64-test' }}
      shell: bash
      run: |
        ./scripts/unittest.exp

    # Boot the riscv images under qemu and run the unit tests via lk.autorun. The rust
    # init hook prints '*** INIT: lk init' early in boot, so also check for that to make
    # sure the rust code actually made it into the image.
    - name: riscv unittest
      if: ${{ startsWith(matrix.project, 'qemu-virt-riscv') && matrix.debug == 2 }}
      shell: bash
      run: |
        env -i DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends qemu-system-misc opensbi
        case "$PROJECT" in
          qemu-virt-riscv32-test) QEMU_ARGS="" ;;
          qemu-virt-riscv64-test) QEMU_ARGS="-6" ;;
          qemu-virt-riscv64-supervisor-test) QEMU_ARGS="-6S" ;;
        esac
        USE_RUST=1 timeout 300 ./scripts/do-qemuriscv $QEMU_ARGS -A 'lk.autorun=ut all;poweroff' | tee qemu.log
        grep -q '\*\*\* INIT: lk init' qemu.log
        grep -q 'SUCCESS! All test cases passed' qemu.log

# vim: ts=2 sw=2 expandtab
